[workspace]
resolver = "3"
members = [
    "raqim-core",
    "raqim-cli"
, "raqim-mcp", "raqim-tui", "raqim-agent-sdk", "raqim-py", "raqim-seige"]

[[bin]]
name = "raqim-core"
path = "src/main.rs"

[[bin]]
name = "raqim-seige"
path = "src/main.rs"

[patch.crates-io]
# This must be the full path to the repository
chrono = { git = "https://github.com/chronotope/chrono", tag = "v0.4.38" }
