[package]
name = "raqim-core"
version = "0.1.0"
edition = "2024"

[dependencies]
# The Zero-copy Data plane
rkyv = "0.8.15"

# The shared memory substrate
iceoryx2 = "0.8.1"

# The State Engine (CRDTs)
loro = "1.0"

# The Nucleus Async Runtime
tokio = {version = "1", features = ["full"]}

blake3 =  "1.5"

zenoh = "1.7.2"
sysinfo = "0.30"
hex =  "0.4"
uuid = { version = "1.8", features = ["v4"] }

lancedb = "0.9"
arrow-array = "52.2"
arrow-schema = "52.2"

anyhow = "1.0"

datafusion = "35.0"

fastembed = "5.12"

futures = "0.3"
clap = { version = "4.5", features = ["derive", "env"] } # For CLI parsing
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
memmap2 = "0.9" 
tokio-uring = "0.4"
wasmtime = "29.0.0"
wasmtime-wasi = "29.0.0"
rand = "0.10.0"
reqwest = { version = "0.13.2", features = ["blocking"] }
notify = "8.2.0"
jsonwebtoken = "10.3.0"
serde_json = "1.0.149"
ed25519-dalek = "2.2.0"
dashmap = "6.1.0"

axum = { version = "0.7.9", features = ["ws", "macros", "multipart"] }
futures-util = "0.3"
tokio-stream = { version = "0.1.18", features = ["sync"] }
aho-corasick = "1.1.4"
