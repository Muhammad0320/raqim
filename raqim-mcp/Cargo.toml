[package]
name = "raqim-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
raqim-core = { path = "../raqim-core", default-features = false, features = ["mock-embedding"] }
mcp_rust_sdk = "0.1.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rkyv = "0.8.15"
hex = "0.4"
async-trait = "0.1.89"
rand = "0.10.1"
ed25519-dalek = "2.2.0"
reqwest = { version = "0.13.2", features = ["json"] }
tokio-tungstenite = "0.29.0"
futures-util = "0.3"
uuid = "1.23.1"

toml_edit = "0.22"
md-5 = "0.10" 
