apiVersion: v1
kind: Service
metadata: 
  name: raqim-headless
  labels: 
    app: raqim-core
spec: 
  clusterIP: None # Disables Load balancing.
  selector: 
    app: raqim-core
  ports: 
    - name: firehose
      port: 8080
      targetPort: 8080
    - name: admin
      port: 8081
      targetPort: 8081
    - name: zehoh
      port: 7447
      targetPort: 7447