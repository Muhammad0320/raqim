name: Sovereign OS Release Pipeline

# 1. THE TRIGGER: Only run this factory when a version tag is pushed
on:
  push: 
    tags: 
      - 'v*'

# 2. TH PERMISSION: Give the factory the right to push to the right registry
permissions:
  contents: read
  packages: write

jobs: 
  build-and-pulish: 
    name:   Build & Push Distroless Image
    runs-on: ubuntu-latest # The Sterile cloud server

    steps: 
    # Step A: Checkout the exact code at this tag
    - name: Checkout Code 
      uses: actions/checkout@v4
    
    # Step B: Set up Docker Buildx (Multi-architectural builder)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Step C: Log into the GHCR using the factory's automated token
    - name: Authenticate to GHCR
      uses: docker/login-action@v3
      with: 
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Step D: Extract metadata to tag the image properly (e.g., v1.0.0 and 'latest' )
    - name: Extract Docker Metadata
      id: meta 
      uses: docker/metadata-action@v5
      with: 
        images: ghcr.io/${{ github.repository }}/raqim-daemon
        tags: |
          type=semver,pattern={{version}}
          type=raw,value=latest

    # Step E: The Physical Build & Push
    # Runs Dockerfile, compiles rust code, strips it to distroless and pushes the final 40MB artifact to the global CDN.
    - name: Build and Push to GHCR
      uses: docker/build-push-action@v5
      with: 
        context: .
        push: true
        tags: ${{steps.meta.outputs.tags}}
        labels: ${{steps.meta.outputs.labels}}
        # Utiliize github action cache to prevent compiling dependency crates from scratch every time
        cache-from: type=gha
        cache-to: type=gha,mode=max
    